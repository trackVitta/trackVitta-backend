spring.application.name=trackNest-App
spring.datasource.url=${DB_Url}
spring.datasource.username=${DB_UserName}
spring.datasource.password=${DB_Password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.security.userEntity.name=${spring.security.user.name}
spring.security.userEntity.password=${spring.security.user.password}
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.port=${PORT:8080}

# JWT
jwt.secret=${JwtSecret}

# Bulk import: Spring's default upload limit is 1 MB, which would reject files before our 5 MB check runs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Insert imported members in batches instead of one statement per row
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
